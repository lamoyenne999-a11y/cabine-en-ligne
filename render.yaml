# ============================================================
#  Render — déploiement "tout-en-un"
#  Web Service (sert le front PWA + l'API) + base PostgreSQL.
#  Render crée la base et injecte DATABASE_URL automatiquement.
#  Tableau de bord Render -> New -> Blueprint -> ce fichier.
# ============================================================
databases:
  - name: cabine-en-ligne-db
    plan: free
    databaseName: cabine
    user: cabine

services:
  - type: web
    name: cabine-en-ligne
    runtime: node
    plan: free
    buildCommand: |
      npm install &&
      cd server && npm install && cd .. &&
      npm run build:web
    startCommand: node server/src/combined.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cabine-en-ligne-db
          property: connectionString
      - key: WAVE_MODE
        value: mock        # passez à "live" + clés API pour le vrai paiement
      - key: WAVE_API_KEY
        sync: false        # à renseigner dans le dashboard Render
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PHONE_PREFIX
        value: "+225"      # Côte d'Ivoire
      # Clé secrète pour ouvrir l'écran "Espace propriétaire" (paiements
      # d'abonnement). À renseigner dans le dashboard Render.
      - key: ADMIN_KEY
        sync: false
      # Notifications push (Expo) : mettez à "true" pour envoyer les alertes
      # sur le téléphone des utilisateurs (sur l'app mobile). Laissez "false"
      # tant que vous voulez uniquement les notifications in-app (web/mock).
      - key: PUSH_ENABLED
        value: "false"
      # (facultatif) ID du projet EAS — nécessaire pour les push sur une build native.
      - key: EXPO_PUBLIC_EAS_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_API_URL
        value: ""          # même origine : le serveur proxyfie /api
